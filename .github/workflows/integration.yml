# Browser tests against a real Foundry instance.
name: Integration tests

on:
  pull_request_target:
    branches: [main]
    # `ready_for_review` is not a default type, and without it a PR opened as a draft would never
    # run at all - the draft check below would skip it and nothing would fire when it was ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    # TEMPORARY: expanded-tests-1901 is here to prove the job before it reaches main, where
    # `pull_request_target` would load it from. Drop it before merging.
    branches: [main, expanded-tests-1901]
  workflow_dispatch:

permissions:
  contents: read
  # to pull the Foundry image, which is private to the organization
  packages: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Built and pushed by hand, one tag per Foundry version
  FOUNDRY_IMAGE: ghcr.io/starwarsfoundryvtt/foundry-ci:13.351@sha256:0a4d43a805c16eaba2df6ecce32ef4ad0fd4ee3657d99c6f3d2fd508e80227eb

jobs:
  # Decides whether the test job names an environment, which decides whether it waits for approval.
  gate:
    runs-on: ubuntu-latest
    # A draft from a fork would queue an approval on every push to the branch
    if: github.event_name != 'pull_request_target' || !github.event.pull_request.draft
    outputs:
      environment: ${{ steps.decide.outputs.environment }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
      - id: decide
        env:
          IS_PR: ${{ github.event_name == 'pull_request_target' }}
          # Empty on anything that is not a pull request, hence the IS_PR check first.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$IS_PR" != "true" ]; then
            echo "environment=" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HEAD_REPO" = "${{ github.repository }}" ]; then
            echo "environment=" >> "$GITHUB_OUTPUT"
          else
            echo "environment=untrusted" >> "$GITHUB_OUTPUT"
          fi

          echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

  integration:
    needs: gate
    # A larger runner, when one is set. `ubuntu-latest` is 4 vCPU / 16 GB, shared between
    # Chromium, a software rasteriser and the Foundry server, and two runs now have failed in
    # ways that read as contention between them. Set the `INTEGRATION_RUNNER` variable (repo or
    # org) to a larger runner's label to move; unset it to come straight back. Note that
    # `workers` is pinned at 1 in playwright.config.js because the world cannot be shared, so
    # more cores buy elbow room between those three processes, not a shorter run by parallelism.
    runs-on: ${{ vars.INTEGRATION_RUNNER || 'ubuntu-latest' }}
    environment: ${{ needs.gate.outputs.environment }}
    # TEMPORARY: the suite is ~5 minutes locally and has not yet finished at all on a runner
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          # `pull_request_target` checks out the base branch by default, which would test nothing
          ref: ${{ needs.gate.outputs.ref }}
          fetch-depth: 0
          # checkout otherwise leaves a token in .git/config, and .git travels with the tree
          persist-credentials: false

      # First, and in one step: `docker login` leaves the credential in ~/.docker/config.json,
      # where anything the pull request runs later could read it. Pulled here, logged out
      # immediately. `GITHUB_TOKEN` is enough because the package belongs to this organization
      # and grants this repository read access - no registry secret to leak to a fork PR.
      - name: Pull the Foundry image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$FOUNDRY_IMAGE"
          docker logout ghcr.io

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Under `pull_request_target` the cache scope is the base branch, so a pull request
          # writing to it would be handing entries to main and to every other pull request.
          cache: ${{ github.event_name == 'push' && 'npm' || '' }}

      # --ignore-scripts: package.json belongs to the pull request, and its lifecycle scripts
      # would otherwise run on a runner that is about to hold the license. Playwright's own
      # postinstall is not needed - the browser download is the explicit step below.
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium

      # The stub's versions are stamped rather than committed: kept in two places they go stale
      # in one, and a world claiming the wrong system version meets a migration prompt on launch.
      - name: Lay out the world
        run: |
          # Foundry writes a README into /data/Data/systems as it builds its user data structure
          mkdir -p "${RUNNER_TEMP}/foundry-data/worlds" "${RUNNER_TEMP}/foundry-data/systems/starwarsffg"
          cp -r .github/foundry-world/qa "${RUNNER_TEMP}/foundry-data/worlds/qa"
          # Foundry runs as uid 1000 in the container and the runner is uid 1001.
          chmod -R 777 "${RUNNER_TEMP}/foundry-data"

          world="${RUNNER_TEMP}/foundry-data/worlds/qa/world.json"
          system="$(jq -r .version system.json)"
          # the image is pinned as tag@digest, so the tag is what is left after dropping the digest
          ref="${FOUNDRY_IMAGE%@*}"
          core="${ref##*:}"

          jq --arg system "$system" --arg core "$core" \
            '.systemVersion = $system | .coreVersion = $core' "$world" > "$world.tmp"
          mv "$world.tmp" "$world"
          echo "world: system $system on core $core"

      # Foundry serves its system directory over HTTP
      - name: Lay out the system under test
        run: |
          mkdir -p "${RUNNER_TEMP}/foundry-system"
          rsync --archive --delete \
            --exclude=.git --exclude=node_modules --exclude=test-results \
            --exclude=playwright-report --exclude=tests/.auth \
            ./ "${RUNNER_TEMP}/foundry-system/"
          find "${RUNNER_TEMP}/foundry-system" -type l -delete

      # Foundry asks a human to accept the licence agreement on first run
      - name: Accept the licence
        env:
          FOUNDRY_LICENSE_JSON: ${{ secrets.FOUNDRY_LICENSE_JSON }}
        run: |
          if [ -z "$FOUNDRY_LICENSE_JSON" ]; then
            echo "FOUNDRY_LICENSE_JSON is not set - Foundry will stop at the licence page." >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/foundry-config"
          printf '%s' "$FOUNDRY_LICENSE_JSON" > "${RUNNER_TEMP}/foundry-config/license.json"
          chmod 777 "${RUNNER_TEMP}/foundry-config"
          chmod 644 "${RUNNER_TEMP}/foundry-config/license.json"

      - name: Start Foundry
        env:
          FOUNDRY_LICENSE_KEY: ${{ secrets.FOUNDRY_LICENSE_KEY }}
        run: |
          # The copy laid out above is mounted as the system itself, so the tests run against
          # this PR's code.
          # Fixed hostname: Foundry binds the licence to it, and a random one per container makes
          # the seeded `license.json` fail verification on every run.
          # No admin key is set: the setup page is reachable from this runner and nowhere else,
          # and nothing in the suite authenticates as the server administrator.
          docker run --detach \
            --name foundry-ci \
            --hostname foundry-ci \
            --publish 127.0.0.1:30000:30000 \
            --volume "${RUNNER_TEMP}/foundry-system:/data/Data/systems/starwarsffg:ro" \
            --volume "${RUNNER_TEMP}/foundry-data:/data/Data" \
            --volume "${RUNNER_TEMP}/foundry-config:/data/Config" \
            --env FOUNDRY_LICENSE_KEY \
            --env FOUNDRY_WORLD=qa \
            --env FOUNDRY_MINIFY_STATIC_FILES=true \
            --env FOUNDRY_TELEMETRY=false \
            "${FOUNDRY_IMAGE}"

      - name: Wait for Foundry
        run: ./scripts/wait-for-foundry.sh http://127.0.0.1:30000

      # Two runs have now failed in ways that only make sense if the machine was starved -
      # a five-property page.evaluate taking 1.6s, then the Foundry server losing documents it
      # had just written. Neither the Playwright report nor the job log says what the box was
      # doing, so measure it rather than guessing at another Chromium flag.
      - name: Machine
        run: |
          echo "cpus: $(nproc)"
          free -h
          df -h /
          docker stats --no-stream

      - name: Start the resource sampler
        run: |
          cat > "${RUNNER_TEMP}/sample.sh" <<'SAMPLER'
          #!/bin/bash
          # `docker stats` on its own is a per-container view; the load average and MemAvailable
          # are what say whether the runner as a whole ran out.
          while true; do
            printf '%s load=%s mem_avail=%skB %s\n' \
              "$(date -u +%H:%M:%S)" \
              "$(cut -d' ' -f1-3 /proc/loadavg)" \
              "$(awk '/MemAvailable/{print $2}' /proc/meminfo)" \
              "$(docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}' 2>/dev/null | tr '\n' ' ')"
            sleep 10
          done
          SAMPLER
          chmod +x "${RUNNER_TEMP}/sample.sh"
          nohup "${RUNNER_TEMP}/sample.sh" > "${RUNNER_TEMP}/resources.log" 2>&1 &
          echo "sampler pid $!"

      # Before the suite has run a thing. If a no-op round trip already costs a second on an
      # idle runner, the suite is not what makes it slow and nothing in the tests will fix it.
      # If it is a few milliseconds here and slow later, the suite degrades something, and the
      # pair of numbers says which.
      - name: Probe (before)
        env:
          FOUNDRY_URL: http://127.0.0.1:30000
        run: node scripts/probe.mjs

      # On a pull request, only what the change calls for; on main, the lot. `affected.mjs` fails
      # open, so an unmapped change still runs everything.
      - name: Choose the tests
        id: choose
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          # Space-separated project names, or empty for the whole suite.
          SUBSET: ${{ vars.INTEGRATION_PROJECTS }}
        run: |
          # A full run names both projects: the opt-in suites are in a project of their own and
          # a default run cannot see them however relevant they are.
          everything="--project=chromium --project=non-default-settings"

          if [ -n "$SUBSET" ]; then
            # TEMPORARY, while the runner is being diagnosed: cuts the run down to a subset.
            # "non-default-settings" is the useful one - seven specs, about three minutes, and it
            # holds three that draw a scene and two that do not, which is the comparison worth
            # having. Unset the variable to go back to the lot.
            echo "SUBSET is set - running only: $SUBSET" >&2
            args=""
            for project in $SUBSET; do args="$args --project=$project"; done
          elif [ -z "$BASE" ]; then
            args="$everything"
          # `affected.mjs` names the projects itself. If it cannot, that is a broken selector and
          # not a reason to test less, so the whole suite runs and the log says why.
          elif ! args="$(node scripts/affected.mjs "$BASE")"; then
            echo "affected.mjs failed - running everything instead" >&2
            args="$everything"
          fi

          # The selection is built from filenames in the pull request, and filenames can contain
          # anything - and SUBSET is hand-typed into a repository variable. Nothing outside this
          # set has any business in a spec path, and a newline would forge a step output.
          case "$args" in
            *[!A-Za-z0-9=./_' '-]*)
              echo "unexpected characters in the selection - running everything instead" >&2
              args="$everything"
              ;;
          esac

          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Run the tests
        env:
          FOUNDRY_URL: http://127.0.0.1:30000
          # Through the environment, not interpolated into the command: the selection is built
          # from filenames the pull request controls, and `${{ }}` is textual substitution.
          ARGS: ${{ steps.choose.outputs.args }}
        # deliberately unquoted - the value is a list of arguments, checked in the step above
        run: npx playwright test $ARGS

      - name: Probe (after)
        if: always()
        env:
          FOUNDRY_URL: http://127.0.0.1:30000
        run: node scripts/probe.mjs || true

      - name: Resources
        if: always()
        run: |
          echo "--- worst 20 samples by load ---"
          sort -t= -k2 -rn "${RUNNER_TEMP}/resources.log" | head -20 || true
          echo "--- last 20 samples ---"
          tail -20 "${RUNNER_TEMP}/resources.log" || true
          df -h /
          # Into the report directory so it travels in the artifact that already gets downloaded
          mkdir -p playwright-report
          cp "${RUNNER_TEMP}/resources.log" playwright-report/ || true

      # Carries the HTML report, and with it the trace and video of anything that failed twice.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Always, not just on failure: the run that lost documents needs the server's side of it,
      # and a green run is the baseline to compare that against.
      - name: Foundry log
        if: always()
        run: docker logs foundry-ci 2>&1 | tail -300

      - name: Stop Foundry
        if: always()
        run: docker rm --force foundry-ci
